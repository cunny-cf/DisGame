<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>JSON Cleaner</title>
<style>
    * { box-sizing: border-box; }
    body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
        background: #1e1f22;
        color: #e3e5e8;
        height: 100vh;
        display: flex;
        flex-direction: column;
    }
    header {
        padding: 14px 20px;
        border-bottom: 1px solid #2b2d31;
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 10px;
    }
    header h1 {
        font-size: 16px;
        margin: 0;
        font-weight: 600;
    }
    #status {
        font-size: 13px;
        color: #b5bac1;
    }
    #status.error { color: #ed4245; }
    #status.ok { color: #23a55a; }

    .controls {
        display: flex;
        align-items: center;
        gap: 10px;
    }
    .controls input[type="file"] {
        font-size: 12px;
        color: #b5bac1;
        max-width: 220px;
    }
    button {
        background: #5865f2;
        color: #fff;
        border: none;
        border-radius: 6px;
        padding: 8px 14px;
        font-size: 13px;
        cursor: pointer;
    }
    button:hover { background: #4752c4; }
    button:disabled { background: #3a3c42; cursor: default; }

    main {
        flex: 1;
        display: flex;
        min-height: 0;
    }
    .pane {
        flex: 1;
        display: flex;
        flex-direction: column;
        min-width: 0;
    }
    .pane + .pane {
        border-left: 1px solid #2b2d31;
    }
    .pane-header {
        padding: 8px 14px;
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: .04em;
        color: #949ba4;
        border-bottom: 1px solid #2b2d31;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }
    textarea {
        flex: 1;
        resize: none;
        border: none;
        outline: none;
        background: #2b2d31;
        color: #e3e5e8;
        font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
        font-size: 13px;
        line-height: 1.5;
        padding: 14px;
        width: 100%;
    }
    #rightPane textarea {
        background: #1e1f22;
    }
</style>
</head>
<body>

<header>
    <h1>JSON Cleaner — extract just <code>name</code> + <code>id</code></h1>
    <div class="controls">
        <input type="file" id="fileInput" accept=".json,application/json,text/plain">
        <button id="copyBtn" disabled>Copy result</button>
    </div>
</header>

<div id="status">Paste JSON on the left, or choose a file above.</div>

<main>
    <div class="pane" id="leftPane">
        <div class="pane-header">Input (raw / messy JSON)</div>
        <textarea id="input" placeholder='Paste any JSON here — an array, or an object wrapping an array (e.g. { "gamesSeen": [...] }), or an id-to-name map. Keys like id / discord_id / appId and name / title / game are all recognized.'></textarea>
    </div>
    <div class="pane" id="rightPane">
        <div class="pane-header">Output (cleaned — name + id only)</div>
        <textarea id="output" readonly placeholder="Cleaned JSON will appear here automatically."></textarea>
    </div>
</main>

<script src="./json-cleaner.js"></script>
</body>
</html>
