<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 — Not Found</title>
<style>
    * { box-sizing: border-box; }
    html, body {
        height: 100%;
        margin: 0;
    }
    body {
        background: #1e1f22;
        color: #e3e5e8;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 20px;
    }
    .wrap {
        max-width: 480px;
    }
    .code {
        font-size: 96px;
        font-weight: 700;
        color: #5865f2;
        line-height: 1;
        margin: 0;
    }
    h1 {
        font-size: 20px;
        font-weight: 600;
        margin: 16px 0 8px;
        color: #f2f3f5;
    }
    p {
        font-size: 14px;
        color: #949ba4;
        line-height: 1.5;
        margin: 0 0 24px;
    }
    a.home-link {
        display: inline-block;
        background: #5865f2;
        color: #fff;
        text-decoration: none;
        font-size: 14px;
        font-weight: 500;
        padding: 10px 20px;
        border-radius: 6px;
        transition: background .15s ease;
    }
    a.home-link:hover {
        background: #4752c4;
    }
</style>
</head>
<body>
    <div class="wrap">
        <p class="code">404</p>
        <h1>Page not found</h1>
        <p>The page you're looking for doesn't exist or may have been moved.</p>
        <a class="home-link" href="./">Go back home</a>
    </div>
</body>
</html>
